[tool.poetry]
name = "pyqic"
version = "0.1.0"
description = "Quasisymmetry and omnigeneity code for stellarator optimization and analysis."
license = "MIT"
authors = ""
homepage = "https://github.com/your-org/pyqic"
repository = "https://github.com/your-org/pyqic"
readme = "README.md"
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Physics"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=2"
scipy = ">=1"
matplotlib = ">=3.10"
tqdm = ">=4"
netCDF4 = ">=1.7"
ijson = ">=3"
scikit-learn = ">=1.8"
numba = ">=0.60"
mplcursors = "==0.7"
plotly = "==6.5.2"
Pillow = "==12.1.0"
pathos = "*"
mpi4py = "*"
BAD = { version = "*", optional = true }
qsc = { version = "*", optional = true }
booz-xform = { version = "*", optional = true }
vmec = { version = "*", optional = true }

@@ [tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
isort = "*"
pre-commit = "*"
mypy = "*"
ipython = "*"
jupyter = "*"

[tool.poetry.extras]
all-features = ["BAD", "qsc", "booz-xform", "vmec"]
tests = ["mpi4py", "vmec", "qsc"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
